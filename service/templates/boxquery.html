<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轮模盒轨迹查询</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='boxquery/boxquery.css') }}?v=20260910-linked">
    <link rel="stylesheet" href="{{ url_for('static', filename='boxquery/trajectory-view.css') }}?v=20260910-linked">
    <script defer src="{{ url_for('static', filename='boxquery/trajectory.js') }}?v=20260910-linked"></script>
    <script defer src="{{ url_for('static', filename='boxquery/trajectory-view.js') }}?v=20260910-linked"></script>
    <script defer src="{{ url_for('static', filename='boxquery/boxquery.js') }}?v=20260910-linked"></script>
</head>
<body>
    <header class="page-header">
        <div><span class="eyebrow">MOLD TRAJECTORY</span><h1>轮模盒轨迹查询</h1></div>
        <nav aria-label="页面导航"><a href="/urldata">轨迹数据与编号配置</a><a href="/">返回首页</a></nav>
    </header>
    <main class="workspace">
        <section class="query-panel" aria-labelledby="queryTitle">
            <form id="queryForm">
                <label for="qrcodeInput" id="queryTitle">查询二维码</label>
                <div class="query-row">
                    <input id="qrcodeInput" name="qrcode" type="text" maxlength="4096" placeholder="输入或扫描二维码内容，按回车查询" autocomplete="off" autofocus required>
                    <button type="submit" class="button primary" id="queryButton">查询定位</button>
                    <button type="button" class="button" id="clearInputButton">清空输入</button>
                </div>
            </form>
            <p id="queryStatus" class="query-status" role="status" aria-live="polite">输入二维码后，点击查询记录可切换各轮定位。</p>
        </section>
        <div class="content-grid">
            <aside class="sidebar" aria-label="扫码记录与检验进度">
                <section class="inspection-panel" aria-labelledby="inspectionTitle">
                    <div class="section-heading"><h2 id="inspectionTitle">三号轮 · 八盒检验</h2><span id="inspectionProgress">0 / 8</span></div>
                    <div class="inspection-slots" id="inspectionSlots" aria-label="三号轮一至八号模盒扫码状态"></div>
                    <p class="subtle" id="roundStatus">第 1 轮检验</p>
                </section>
                <section class="history-panel" aria-labelledby="historyTitle">
                    <div class="section-heading"><h2 id="historyTitle">查询记录</h2><button type="button" class="text-button" id="clearHistoryButton">清空记录</button></div>
                    <p class="subtle">点击二维码，查看该次记录的模盒轨迹</p>
                    <div id="historyList" class="history-list"></div>
                </section>
            </aside>
            <div class="main-content">
                <section class="trajectory-panel" aria-labelledby="trajectoryTitle">
                    <header class="trajectory-header"><div class="trajectory-brand"><span class="trajectory-icon" aria-hidden="true">◎</span><div><h2 id="trajectoryTitle">轮模盒 · 运动轨迹</h2><p>MOLD MOTION · 七轮联动定位</p></div></div><button type="button" class="button small" id="resetButton">重置高亮</button></header>
                    <div class="diagram-caption"><span>转台透视 · 按设备轮位布局</span><span>↻ 顺时针定位</span></div>
                    <div class="selection-summary"><div><span class="summary-label">当前二维码</span><strong id="selectedCode">尚未选择</strong><span id="selectedTime" class="subtle"></span></div><span id="locationStatus" class="location-status">等待查询</span></div>
                    <div class="diagram-scroll" role="region" aria-label="设备轮位图，小屏幕可横向滚动" tabindex="0">
                        <svg id="wheelDiagram" class="wheel-diagram" viewBox="0 0 1000 430" role="img" aria-labelledby="diagramTitle diagramDescription">
                            <title id="diagramTitle">模盒轮位轨迹</title>
                            <desc id="diagramDescription">一号轮为左侧倾斜椭圆，二、三号轮在左下，四、五号轮在上方，六号轮在右下，八号轮在右上。点击查询记录后，高亮移动至各轮模盒编号对应位置。</desc>
                        </svg>
                    </div>
                    <footer class="diagram-footer"><span class="legend">工位固定 · 蓝色模盒为当前定位</span><span id="dataSource">编号范围读取现有配置</span></footer>
                </section>
                <section class="matches-panel" id="matchPanel" aria-labelledby="matchTitle" hidden>
                    <div class="section-heading"><h2 id="matchTitle">匹配记录</h2><span class="subtle" id="matchCount"></span></div>
                    <div class="table-scroll"><table><thead><tr><th scope="col">记录时间</th><th scope="col">二维码</th><th scope="col">三号轮模盒</th><th scope="col">定位</th></tr></thead><tbody id="matchBody"></tbody></table></div>
                </section>
            </div>
        </div>
    </main>
    <noscript>请启用 JavaScript，以查询二维码和查看模盒轨迹。</noscript>
</body>
</html>
