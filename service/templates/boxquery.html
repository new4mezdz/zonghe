<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轮模盒查询</title>
    <style>


        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #eaeaea; }
        .header { background: rgba(255,255,255,0.05); padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { font-size: 1.8rem; }
        .header a { color: #e94560; text-decoration: none; margin-left: 20px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
        .panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .panel-title { font-size: 1.1rem; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; }

        /* 查询栏 */
        .query-row { display: flex; gap: 10px; align-items: center; }
        .query-input {
            flex: 1; padding: 12px 16px; font-size: 1rem;
            background: rgba(0,0,0,0.3); border: 1px solid #444;
            border-radius: 8px; color: #fff; outline: none;
        }
        .query-input:focus { border-color: #e94560; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: all 0.2s; }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-primary:hover { background: #d63850; }
        .btn-secondary { background: #444; color: #fff; }
        .btn-secondary:hover { background: #555; }
        .btn-sm { padding: 8px 16px; font-size: 0.85rem; }

        /* 8个盒子区域 */
        .boxes-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 10px;
        }
        .box-item {
            aspect-ratio: 1;
            background: #3a3a4a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            border: 3px solid transparent;
            position: relative;
            min-height: 120px;
        }
        .box-item .box-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #888;
            transition: color 0.4s;
        }
        .box-item .box-label {
            font-size: 0.9rem;
            color: #888;
            margin-top: 8px;
            transition: color 0.4s;
        }
        .box-item .box-value {
            font-size: 0.75rem;
            color: #666;
            margin-top: 4px;
            font-family: Consolas, monospace;
            transition: color 0.4s;
        }

        /* 计数徽章 */
        .box-item .box-count {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #e94560;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            min-width: 24px;
            height: 24px;
            padding: 0 6px;
            border-radius: 12px;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .box-item .box-count.show {
            display: flex;
        }

        /* 高亮状态 */
        .box-item.highlight {
            background: linear-gradient(135deg, #1a5c2e, #2d8a4e);
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .box-item.highlight .box-number { color: #fff; }
        .box-item.highlight .box-label { color: #c8e6c9; }
        .box-item.highlight .box-value { color: #a5d6a7; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(76, 175, 80, 0.4); }
            50% { box-shadow: 0 0 35px rgba(76, 175, 80, 0.7); }
        }

        /* 结果信息 */
        .result-info {
            margin-top: 15px; padding: 12px 16px;
            border-radius: 8px; font-size: 0.9rem;
            display: none;
        }
        .result-info.show { display: block; }
        .result-info.success { background: rgba(76,175,80,0.15); border: 1px solid rgba(76,175,80,0.3); color: #81c784; }
        .result-info.warning { background: rgba(255,152,0,0.15); border: 1px solid rgba(255,152,0,0.3); color: #ffb74d; }
        .result-info.error { background: rgba(244,67,54,0.15); border: 1px solid rgba(244,67,54,0.3); color: #e57373; }

        /* 数据统计 */
        .stats-text { color: #888; font-size: 0.85rem; margin-top: 10px; }
        .stats-text span { color: #e94560; font-weight: bold; }

        /* 匹配详情表格 */
        .match-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        .match-table th { background: rgba(0,0,0,0.3); padding: 10px 8px; text-align: left; color: #aaa; }
        .match-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .match-table tr:hover { background: rgba(255,255,255,0.03); }

        .loading { text-align: center; padding: 20px; color: #888; display: none; }
        .loading.show { display: block; }

        @media (max-width: 600px) {
            .boxes-container { grid-template-columns: repeat(2, 1fr); }
        }

         /* 左侧查询记录 */
.main-layout { display: flex; gap: 0; }
.history-panel {
    width: 280px; min-width: 280px;
    background: rgba(255,255,255,0.03);
    border-right: 1px solid rgba(255,255,255,0.1);
    height: calc(100vh - 73px);
    overflow-y: auto;
    padding: 15px;
}
.history-panel h3 { font-size: 0.95rem; color: #aaa; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.history-list { list-style: none; }
.history-item {
    padding: 10px 12px; margin-bottom: 6px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; cursor: pointer; transition: all 0.2s;
}
.history-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }
.history-item.active { border-color: #e94560; background: rgba(233,69,96,0.1); }
.history-item .hi-qrcode {
    font-size: 0.85rem; color: #ddd; font-family: Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.history-item .hi-meta {
    font-size: 0.75rem; color: #888; margin-top: 4px;
    display: flex; justify-content: space-between;
}
.history-item .hi-box { color: #4CAF50; font-weight: bold; }
.history-clear { width: 100%; margin-top: 10px; padding: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #888; cursor: pointer; font-size: 0.8rem; }
.history-clear:hover { background: rgba(255,255,255,0.1); color: #ccc; }
.main-content { flex: 1; min-width: 0; }

@media (max-width: 800px) {
    .main-layout { flex-direction: column; }
    .history-panel { width: 100%; min-width: 0; height: auto; max-height: 200px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
}
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 轮模盒查询</h1>
        <a href="/">← 返回首页</a>
    </div>
   <div class="main-layout">
    <!-- 左侧查询记录 -->
    <div class="history-panel">
        <h3>📝 查询记录</h3>
        <ul class="history-list" id="historyList"></ul>
        <button class="history-clear" onclick="clearHistory()">清空记录</button>
    </div>

    <!-- 右侧主内容 -->
    <div class="main-content">
        <div class="container">
            <!-- 查询区 -->
            <div class="panel">
                <div class="panel-title">🔍 二维码查询</div>
                <div class="query-row">
                    <input type="text" class="query-input" id="qrcodeInput" placeholder="输入二维码内容..." autofocus>
                    <button class="btn btn-primary" onclick="doQuery()">查询</button>
                    <button class="btn btn-secondary" onclick="clearInput()">清空</button>
                </div>
                <div class="stats-text" id="dataStats">按回车或点击查询按钮开始</div>
            </div>

            <!-- 8个盒子 -->
            <div class="panel">
                <div class="panel-title">
                    <span>📦 三号轮模盒状态（最近2小时数据）</span>
                    <button class="btn btn-secondary btn-sm" onclick="resetBoxes()">重置</button>
                </div>
                <div class="boxes-container" id="boxesContainer">
                    <div class="box-item" id="box0">
                        <span class="box-count" id="boxCount0">0</span>
                        <span class="box-number">1</span>
                        <span class="box-label">三号轮模盒</span>
                        <span class="box-value" id="boxVal0">-</span>
                    </div>
                    <div class="box-item" id="box1">
                        <span class="box-count" id="boxCount1">0</span>
                        <span class="box-number">2</span>
                        <span class="box-label">三号轮模盒</span>
                        <span class="box-value" id="boxVal1">-</span>
                    </div>
                    <div class="box-item" id="box2">
                        <span class="box-count" id="boxCount2">0</span>
                        <span class="box-number">3</span>
                        <span class="box-label">三号轮模盒</span>
                        <span class="box-value" id="boxVal2">-</span>
                    </div>
                    <div class="box-item" id="box3">
                        <span class="box-count" id="boxCount3">0</span>
                        <span class="box-number">4</span>
                        <span class="box-label">三号轮模盒</span>
                        <span class="box-value" id="boxVal3">-</span>
                    </div>
                    <div class="box-item" id="box4">
                        <span class="box-count" id="boxCount4">0</span>
                        <span class="box-number">5</span>
                        <span class="box-label">三号轮模盒</span>
                        <span class="box-value" id="boxVal4">-</span>
                    </div>
                    <div class="box-item" id="box5">
                        <span class="box-count" id="boxCount5">0</span>
                        <span class="box-number">6</span>
                        <span class="box-label">三号轮模盒</span>
                        <span class="box-value" id="boxVal5">-</span>
                    </div>
                    <div class="box-item" id="box6">
                        <span class="box-count" id="boxCount6">0</span>
                        <span class="box-number">7</span>
                        <span class="box-label">三号轮模盒</span>
                        <span class="box-value" id="boxVal6">-</span>
                    </div>
                    <div class="box-item" id="box7">
                        <span class="box-count" id="boxCount7">0</span>
                        <span class="box-number">8</span>
                        <span class="box-label">三号轮模盒</span>
                        <span class="box-value" id="boxVal7">-</span>
                    </div>
                </div>
            </div>

            <!-- 结果信息 -->
            <div class="result-info" id="resultInfo"></div>

            <!-- 匹配详情 -->
            <div class="panel" id="matchPanel" style="display:none;">
                <div class="panel-title">📋 匹配详情</div>
                <table class="match-table">
                    <thead>
                        <tr>
                            <th>三号轮模盒编号</th>
                            <th>二维码</th>
                            <th>时间</th>
                        </tr>
                    </thead>
                    <tbody id="matchBody"></tbody>
                </table>
            </div>

            <div class="loading" id="loading">⏳ 正在查询最近2小时数据...</div>
        </div>
    </div>
</div>

    <script>
    let boxHitCounts = [0, 0, 0, 0, 0, 0, 0, 0];
    let queryHistory = []; // {qrcode, time, boxNum, matches}

    document.getElementById('qrcodeInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doQuery();
    });

    function clearInput() {
        document.getElementById('qrcodeInput').value = '';
        document.getElementById('qrcodeInput').focus();
    }

    function resetBoxes() {
        boxHitCounts = [0, 0, 0, 0, 0, 0, 0, 0];
        for (let i = 0; i < 8; i++) {
            document.getElementById('box' + i).classList.remove('highlight');
            document.getElementById('boxVal' + i).textContent = '-';
            const countEl = document.getElementById('boxCount' + i);
            countEl.textContent = '0';
            countEl.classList.remove('show');
        }
        document.getElementById('dataStats').textContent = '按回车或点击查询按钮开始';
        document.getElementById('resultInfo').classList.remove('show');
        document.getElementById('matchPanel').style.display = 'none';
    }

    function clearHistory() {
        queryHistory = [];
        renderHistory();
        document.getElementById('resultInfo').classList.remove('show');
        document.getElementById('matchPanel').style.display = 'none';
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        if (queryHistory.length === 0) {
            list.innerHTML = '<li style="color:#666;font-size:0.8rem;text-align:center;padding:20px 0;">暂无查询记录</li>';
            return;
        }
        list.innerHTML = queryHistory.map((item, idx) => {
            const boxText = item.boxNum != null ? '盒' + item.boxNum : '未匹配';
            return '<li class="history-item" onclick="showHistoryItem(' + idx + ')" id="hItem' + idx + '">' +
                '<div class="hi-qrcode" title="' + escapeHtml(item.qrcode) + '">' + escapeHtml(item.qrcode) + '</div>' +
                '<div class="hi-meta"><span>' + item.time + '</span><span class="hi-box">' + boxText + '</span></div>' +
            '</li>';
        }).join('');
    }

    function showHistoryItem(idx) {
        // 高亮选中
        document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
        const el = document.getElementById('hItem' + idx);
        if (el) el.classList.add('active');

        const item = queryHistory[idx];
        if (!item) return;

        // 显示结果信息
        if (item.matches.length === 0) {
            showResult('warning', '【' + item.qrcode + '】未找到匹配记录');
        } else {
            showResult('success', '【' + item.qrcode + '】找到 ' + item.matches.length + ' 条记录，三号轮模盒编号为 ' + item.boxNum);
        }

        // 显示匹配详情表
        if (item.matches.length > 0) {
            document.getElementById('matchPanel').style.display = 'block';
            const tbody = document.getElementById('matchBody');
            tbody.innerHTML = item.matches.map(m => {
                const timeStr = m.time.includes('T') ? m.time.replace('T', ' ').substring(0, 19) : m.time;
                return '<tr>' +
                    '<td style="font-family:Consolas;color:#888;font-size:1.1rem;font-weight:bold;">' + m.box_num + '</td>' +
                    '<td>' + escapeHtml(m.content) + '</td>' +
                    '<td>' + timeStr + '</td>' +
                '</tr>';
            }).join('');
        } else {
            document.getElementById('matchPanel').style.display = 'none';
        }
    }

    async function doQuery() {
        const qrcode = document.getElementById('qrcodeInput').value.trim();
        if (!qrcode) { alert('请输入二维码内容'); return; }

        document.getElementById('loading').classList.add('show');
        document.getElementById('resultInfo').classList.remove('show');
        document.getElementById('matchPanel').style.display = 'none';

        try {
            const res = await fetch('/api/urldata/box_query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qrcode })
            });
            const data = await res.json();
            document.getElementById('loading').classList.remove('show');

            if (!data.success) {
                showResult('error', data.error || '查询失败');
                return;
            }

            document.getElementById('dataStats').innerHTML =
                '共 <span>' + data.total_records + '</span> 条记录，匹配到 <span>' + data.matches.length + '</span> 条';

            const now = new Date();
            const timeStr = now.getFullYear() + '-' +
                String(now.getMonth()+1).padStart(2,'0') + '-' +
                String(now.getDate()).padStart(2,'0') + ' ' +
                String(now.getHours()).padStart(2,'0') + ':' +
                String(now.getMinutes()).padStart(2,'0') + ':' +
                String(now.getSeconds()).padStart(2,'0');

            let boxNum = null;

            if (data.matches.length === 0) {
                showResult('warning', '未找到匹配的二维码，请确认输入是否正确');
            } else {
                const latest = data.matches[data.matches.length - 1];
                boxNum = latest.box_num;
                const boxIndex = boxNum - 1;

                if (boxIndex >= 0 && boxIndex < 8) {
                    document.getElementById('box' + boxIndex).classList.add('highlight');
                    document.getElementById('boxVal' + boxIndex).textContent = '编号: ' + boxNum;
                    boxHitCounts[boxIndex]++;
                    const countEl = document.getElementById('boxCount' + boxIndex);
                    countEl.textContent = boxHitCounts[boxIndex];
                    if (boxHitCounts[boxIndex] >= 2) countEl.classList.add('show');
                }

                showResult('success', '找到 ' + data.matches.length + ' 条匹配记录，三号轮模盒编号为 ' + boxNum);

                document.getElementById('matchPanel').style.display = 'block';
                const tbody = document.getElementById('matchBody');
                tbody.innerHTML = data.matches.map(m => {
                    const t = m.time.includes('T') ? m.time.replace('T', ' ').substring(0, 19) : m.time;
                    return '<tr>' +
                        '<td style="font-family:Consolas;color:#888;font-size:1.1rem;font-weight:bold;">' + m.box_num + '</td>' +
                        '<td>' + escapeHtml(m.content) + '</td>' +
                        '<td>' + t + '</td>' +
                    '</tr>';
                }).join('');
            }

            // 记录到查询历史（最新的在最上面）
            queryHistory.unshift({ qrcode, time: timeStr, boxNum, matches: data.matches });
            renderHistory();

            // 清空输入框，准备下一次扫码
            document.getElementById('qrcodeInput').value = '';
            document.getElementById('qrcodeInput').focus();

        } catch (e) {
            document.getElementById('loading').classList.remove('show');
            showResult('error', '请求失败: ' + e.message);
        }
    }

    function showResult(type, msg) {
        const el = document.getElementById('resultInfo');
        el.className = 'result-info show ' + type;
        el.textContent = msg;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 初始化
    renderHistory();
</script>
</body>
</html>
