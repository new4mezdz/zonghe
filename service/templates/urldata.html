<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模盒轨迹跟踪查询</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #eaeaea; }
        .header { background: rgba(255,255,255,0.05); padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { font-size: 1.8rem; }
        .header a { color: #e94560; text-decoration: none; margin-left: 20px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .panel-title { font-size: 1.1rem; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; font-size: 0.85rem; }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-primary:hover { background: #d63850; }
        .btn-secondary { background: #444; color: #fff; }
        .btn-secondary:hover { background: #555; }
        .btn-warning { background: #ffaa00; color: #000; }
        .btn-warning:hover { background: #e69900; }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-block { width: 100%; padding: 10px; }
        .query-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        .query-row:last-child { margin-bottom: 0; }
        .query-label { min-width: 70px; color: #aaa; font-size: 0.9rem; }
        .query-input { flex: 1; min-width: 150px; padding: 8px 12px; background: rgba(0,0,0,0.3); border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 0.9rem; }
        .query-input:focus { outline: none; border-color: #e94560; }
        select.query-input { cursor: pointer; }
        .stats-bar { background: rgba(0,0,0,0.3); padding: 12px 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .stats-text { color: #aaa; font-size: 0.9rem; }
        .stats-text span { color: #e94560; font-weight: bold; }
        .results-panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th { background: rgba(0,0,0,0.3); padding: 10px 8px; text-align: left; color: #aaa; font-weight: normal; position: sticky; top: 0; }
        td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:hover { background: rgba(255,255,255,0.03); }
        .type-url { color: #6bff6b; }
        .type-fail { color: #ff6b6b; }
        .type-other { color: #ffbb6b; }
        .content-cell { display: flex; align-items: center; max-width: 400px; }
        .content-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .copy-btn {
            background: rgba(233,69,96,0.2); border: 1px solid rgba(233,69,96,0.4);
            color: #e94560; border-radius: 4px; padding: 2px 8px; cursor: pointer;
            font-size: 0.75rem; margin-left: 6px; white-space: nowrap;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: #e94560; color: #fff; }
        .copy-btn.copied { background: rgba(34,197,94,0.3); border-color: rgba(34,197,94,0.5); color: #22c55e; }
        .number-cell { font-family: Consolas, monospace; font-size: 1.1rem; color: #888; }
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .empty-state .icon { font-size: 3rem; margin-bottom: 15px; }
        .duplicates-info { background: rgba(255,170,0,0.1); border: 1px solid rgba(255,170,0,0.3); border-radius: 6px; padding: 10px 15px; margin-bottom: 15px; color: #ffaa00; display: none; }
        .duplicates-info.show { display: block; }
        .log-box { background: rgba(0,0,0,0.3); border: 1px solid #333; border-radius: 8px; padding: 10px; height: 120px; overflow-y: auto; font-family: Consolas, monospace; font-size: 0.8rem; margin-top: 10px; }
        .log-info { color: #e0e0e0; }
        .log-success { color: #22c55e; }
        .log-warning { color: #f59e0b; }
        .log-error { color: #ef4444; }
        .log-clickable { cursor: pointer; text-decoration: underline; text-decoration-style: dotted; }
        .log-clickable:hover { filter: brightness(1.3); }
        .scheduler-status { font-size: 0.85rem; color: #60a5fa; margin-top: 10px; text-align: center; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: #1e2030; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 25px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 20px; font-size: 1.2rem; }
        .modal-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .modal-row label { min-width: 120px; font-size: 0.9rem; color: #aaa; }
        .modal-row input { flex: 1; padding: 8px 10px; background: rgba(0,0,0,0.3); border: 1px solid #444; border-radius: 5px; color: #fff; text-align: center; font-size: 0.9rem; }
        .modal-row input:focus { outline: none; border-color: #e94560; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        .modal-check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .modal-check input[type="checkbox"] { width: 18px; height: 18px; accent-color: #e94560; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .time-input { min-width: auto !important; width: 140px; flex: none !important; padding: 10px 12px; font-size: 0.95rem; }
        .date-input { min-width: auto !important; width: 170px; flex: none !important; padding: 10px 12px; font-size: 0.95rem; }
        .query-input-lg { padding: 12px 16px; font-size: 1rem; height: 50px; }
        .box-check-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .box-check-item { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: rgba(0,0,0,0.2); border: 1px solid #444; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; color: #ccc; }
        .box-check-item:hover { border-color: #e94560; }
        .box-check-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: #e94560; cursor: pointer; }
        .box-check-item.checked { border-color: #e94560; background: rgba(233,69,96,0.1); color: #fff; }
        tr.highlight-row { background: rgba(233,69,96,0.25) !important; transition: background 0.3s; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 盒膜轨迹跟踪查询</h1>
        <a href="/">← 返回首页</a>
    </div>
    <div class="container">
        <!-- 数据查询模块 -->
        <div class="panel">
            <div class="panel-title">🔍 数据查询</div>
            <div class="query-row">
                <span class="query-label">时间段:</span>
                <input type="date" class="query-input date-input" id="processDate">
                <input type="time" class="query-input time-input" id="processStartTime" value="08:00">
                <span style="color:#aaa;">~</span>
                <input type="time" class="query-input time-input" id="processStopTime" value="18:00">
                <button class="btn" style="background:#6366f1;color:#fff;" onclick="setRecentTime(30)">近半小时</button>
                <button class="btn" style="background:#6366f1;color:#fff;" onclick="setRecentTime(60)">近一小时</button>
                <button class="btn btn-primary" onclick="queryByDate()">查询</button>
                <button class="btn btn-warning" onclick="queryDuplicates()">查重复</button>
            </div>
            <div class="query-row" style="padding: 12px 0;">
                <span class="query-label">二维码:</span>
                <input type="text" class="query-input query-input-lg" id="contentInput" placeholder="搜索内容...">
                <button class="btn btn-primary" onclick="queryByContent()">查询</button>
                <button class="btn btn-danger" onclick="document.getElementById('contentInput').value=''">清空</button>
            </div>
        </div>

        <!-- InfluxDB 调试面板 -->
        <div class="panel" style="display: none;">
            <div class="panel-title">🗄️ InfluxDB 调试面板</div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                <button class="btn btn-primary" onclick="checkInfluxStatus()">🔍 检测连接</button>
                <button class="btn btn-success" onclick="queryInfluxSample('bucket_data')">📦 查 jbcj01 数据</button>
                <button class="btn btn-warning" onclick="queryInfluxSample('bucket_verify')">📦 查 jbcj03 数据</button>
                <select id="influxHours" class="query-input" style="max-width:120px;">
                    <option value="1">最近1小时</option>
                    <option value="6">最近6小时</option>
                    <option value="24">最近24小时</option>
                    <option value="168">最近7天</option>
                </select>
            </div>
            <div id="influxStatus" style="margin-bottom: 10px;"></div>
            <div class="log-box" id="influxLog" style="height: 200px; font-size: 0.8rem;"></div>
        </div>

        <!-- 统计栏 -->
        <div class="stats-bar">
            <div class="stats-text" id="statsText">就绪</div>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-secondary" id="sortBtn" onclick="toggleSort()">🔼 时间正序</button>
                <button class="btn btn-secondary" onclick="clearResults()">清空结果</button>
            </div>
        </div>
        <div class="duplicates-info" id="duplicatesInfo"></div>

        <!-- 查询结果 -->
        <div class="results-panel">
            <div class="table-container" id="tableContainer" style="max-height: 400px; overflow-y: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>输送盒模</th><th>一号轮</th><th>二号轮</th><th>三号轮</th><th>四号轮</th><th>五号轮</th><th>六号轮</th><th>七号轮</th><th>八号轮</th>
                            <th>校验位</th><th>时间</th><th>类型</th><th>二维码</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <tr><td colspan="13"><div class="empty-state"><div class="icon">📋</div><div>请选择查询条件</div></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 运行日志 -->
        <div class="panel" style="margin-top: 15px;">
            <div class="panel-title">📝 运行日志</div>
            <div class="log-box" id="logBox"></div>
        </div>

        <!-- 系统设置模块 -->
        <div class="panel" style="margin-top: 15px;">
            <div class="panel-title">🔧 系统设置</div>
            <div class="settings-grid">
                <button class="btn btn-secondary btn-block" onclick="openNumberQueryModal()">🔢 编号查询</button>
                <button class="btn btn-secondary btn-block" onclick="openSettingsModal()">⚙️ 设置上下限</button>
                <button class="btn btn-secondary btn-block" onclick="openSchedulerModal()">⏰ 定时处理设置</button>
                <button class="btn btn-secondary btn-block" onclick="openManualNumberModal()">🔢 手动设定编号</button>
                <button class="btn btn-secondary btn-block" onclick="openErrorSettingsModal()">⚠️ 错误时设置</button>
            </div>
            <div class="scheduler-status" id="schedulerStatus">⏸️ 定时处理未启用</div>
        </div>
    </div>

    <!-- 设置上下限弹窗 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3>⚙️ 设置编号上下限</h3>
            <div id="settingsRows"></div>
            <div class="modal-btns">
                <button class="btn btn-success" onclick="saveSettings()">💾 保存</button>
                <button class="btn btn-secondary" onclick="closeModal('settingsModal')">取消</button>
            </div>
        </div>
    </div>

    <!-- 定时处理设置弹窗 -->
    <div class="modal-overlay" id="schedulerModal">
        <div class="modal">
            <h3>⏰ 定时处理设置</h3>
            <div class="modal-check">
                <input type="checkbox" id="schedulerEnabled">
                <label>启用定时自动处理</label>
            </div>
            <div class="modal-row">
                <label>执行间隔:</label>
                <input type="number" id="schedulerHours" min="0" style="width:60px;"> <span style="color:#aaa;">小时</span>
                <input type="number" id="schedulerMinutes" min="0" style="width:60px;"> <span style="color:#aaa;">分钟</span>
                <input type="number" id="schedulerSeconds" min="0" style="width:60px;"> <span style="color:#aaa;">秒</span>
            </div>
            <div class="modal-check">
                <input type="checkbox" id="schedulerRetry">
                <label>处理失败时自动重试</label>
            </div>
            <div class="modal-row">
                <label>重试间隔(分钟):</label>
                <input type="number" id="schedulerRetryInterval" min="1" style="width:80px;">
            </div>
            <div class="modal-btns">
                <button class="btn btn-success" onclick="saveScheduler()">💾 保存设置</button>
                <button class="btn btn-secondary" onclick="closeModal('schedulerModal')">取消</button>
            </div>
        </div>
    </div>

    <!-- 手动设定编号弹窗 -->
    <div class="modal-overlay" id="manualNumberModal">
        <div class="modal">
            <h3>🔢 设定各轮模盒的"最后编号"</h3>
            <p style="color:#888; font-size:0.85rem; margin-bottom:15px;">下次处理时将从此编号+1开始</p>
            <div id="manualNumberRows"></div>
            <div class="modal-btns">
                <button class="btn btn-success" onclick="saveManualNumbers()">💾 保存更改</button>
                <button class="btn btn-danger" onclick="resetNumbers()">🗑️ 删除记录</button>
                <button class="btn btn-secondary" onclick="closeModal('manualNumberModal')">取消</button>
            </div>
        </div>
    </div>

    <!-- 编号查询弹窗（多选版） -->
    <div class="modal-overlay" id="numberQueryModal">
        <div class="modal">
            <h3>🔢 编号查询</h3>
            <p style="color:#aaa; font-size:0.85rem; margin-bottom:10px;">选择轮模盒（可多选）：</p>
            <div class="box-check-grid" id="boxCheckGrid"></div>
            <div style="margin-bottom:12px; display:flex; gap:8px;">
                <button class="btn btn-secondary" onclick="toggleAllBoxChecks()" style="font-size:0.8rem; padding:4px 12px;">全选/取消</button>
            </div>
            <div class="modal-row">
                <label>编号范围:</label>
                <input type="text" class="query-input" id="numberInput" placeholder="如: 1-100 或 1,5,10" style="flex:1;">
            </div>
            <div class="modal-btns">
                <button class="btn btn-primary" onclick="queryByNumber();closeModal('numberQueryModal')">🔍 查询</button>
                <button class="btn btn-secondary" onclick="queryAll();closeModal('numberQueryModal')">全部</button>
                <button class="btn btn-danger" onclick="clearNumberInput()">清空</button>
                <button class="btn btn-secondary" onclick="closeModal('numberQueryModal')">取消</button>
            </div>
        </div>
    </div>

    <!-- 错误时设置弹窗 -->
    <div class="modal-overlay" id="errorSettingsModal">
        <div class="modal">
            <h3>⚠️ 校验错误时处理设置</h3>
            <div class="modal-check">
                <input type="checkbox" id="errorVerifyEnabled">
                <label>启用校验功能</label>
            </div>
            <p style="color:#aaa; font-size:0.85rem; margin-bottom:10px;">当校验出错时，各轮模盒从以下数字开始循环：</p>
            <div id="errorSettingsRows"></div>
            <div id="verifyFileStatus" style="margin-top:10px; font-size:0.85rem;"></div>
            <div class="modal-btns">
                <button class="btn btn-success" onclick="saveErrorSettings()">💾 保存设置</button>
                <button class="btn btn-secondary" onclick="closeModal('errorSettingsModal')">取消</button>
            </div>
        </div>
    </div>

    <script>
        const BOX_NAMES = ['输送盒模','一号轮模盒','二号轮模盒','三号轮模盒','四号轮模盒','五号轮模盒','六号轮模盒','七号轮模盒','八号轮模盒'];
        const BOX_COUNT = 9;
        let sortOrder = 'asc';
        let lastQueryParams = null;

        function toggleSort() {
            sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
            document.getElementById('sortBtn').textContent = sortOrder === 'desc' ? '🔽 时间倒序' : '🔼 时间正序';
            if (lastQueryParams) doQuery({...lastQueryParams, sort_order: sortOrder});
        }

        function addLog(msg, level='info', content=null, timeStr=null) {
            const box = document.getElementById('logBox');
            const time = new Date().toLocaleTimeString();
            if (content) {
                const safeContent = escapeHtml(content);
                box.innerHTML += `<div class="log-${level} log-clickable" data-content="${safeContent}" data-time="${timeStr || ''}" onclick="onLogClick(this)">[${time}] ${escapeHtml(msg)}</div>`;
            } else {
                box.innerHTML += `<div class="log-${level}">[${time}] ${escapeHtml(msg)}</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }

        function onLogClick(el) {
            const content = el.getAttribute('data-content');
            if (!content) return;
            // 先在当前结果中查找匹配行
            const rows = document.querySelectorAll('#resultsBody tr[data-content]');
            let found = false;
            for (const row of rows) {
                if (row.getAttribute('data-content') === content) {
                    // 移除之前的高亮
                    document.querySelectorAll('tr.highlight-row').forEach(r => r.classList.remove('highlight-row'));
                    row.classList.add('highlight-row');
                    // 滚动到该行
                    const container = document.getElementById('tableContainer');
                    const rowTop = row.offsetTop - container.offsetTop;
                    container.scrollTo({ top: rowTop - 50, behavior: 'smooth' });
                    // 3秒后移除高亮
                    setTimeout(() => row.classList.remove('highlight-row'), 3000);
                    found = true;
                    break;
                }
            }
            if (!found) {
                // 当前结果没有，自动搜索该二维码
                document.getElementById('contentInput').value = content;
                queryByContent();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().slice(0, 10);
            document.getElementById('processDate').value = today;
            loadSchedulerStatus();
            initBoxCheckGrid();
        });

        // ===== 编号查询多选初始化 =====
        function initBoxCheckGrid() {
            const grid = document.getElementById('boxCheckGrid');
            grid.innerHTML = BOX_NAMES.map((name, i) => `
                <label class="box-check-item" id="boxItem${i}" onclick="toggleBoxItem(${i})">
                    <input type="checkbox" class="boxCheck" value="${i}" onclick="event.stopPropagation();" onchange="updateBoxItemStyle(${i})">
                    ${name}
                </label>
            `).join('');
        }

        function toggleBoxItem(i) {
            const cb = document.querySelector(`#boxItem${i} .boxCheck`);
            cb.checked = !cb.checked;
            updateBoxItemStyle(i);
        }

        function updateBoxItemStyle(i) {
            const item = document.getElementById('boxItem' + i);
            const cb = item.querySelector('.boxCheck');
            if (cb.checked) {
                item.classList.add('checked');
            } else {
                item.classList.remove('checked');
            }
        }

        function toggleAllBoxChecks() {
            const checks = document.querySelectorAll('.boxCheck');
            const allChecked = Array.from(checks).every(c => c.checked);
            checks.forEach((c, i) => {
                c.checked = !allChecked;
                updateBoxItemStyle(i);
            });
        }

        function getSelectedBoxIndices() {
            const checks = document.querySelectorAll('.boxCheck:checked');
            return Array.from(checks).map(c => parseInt(c.value));
        }

        // ===== 数据处理 =====
        async function doProcess() {
            const dateVal = document.getElementById('processDate').value;
            const startTime = document.getElementById('processStartTime').value;
            const stopTime = document.getElementById('processStopTime').value;

            if (!dateVal) { alert('请选择日期'); return false; }
            if (!startTime || !stopTime) { alert('请设置起止时间'); return false; }
            if (startTime >= stopTime) { alert('开始时间必须早于结束时间'); return false; }

            const startISO = `${dateVal}T${startTime}:00+08:00`;
            const stopISO = `${dateVal}T${stopTime}:00+08:00`;

            addLog(`开始处理数据: ${dateVal} ${startTime} ~ ${stopTime}`);
            try {
                const res = await fetch('/api/urldata/process', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ start_time: startISO, stop_time: stopISO })
                });
                const data = await res.json();
                if (data.logs) data.logs.forEach(l => addLog(l.msg, l.level, l.content || null, l.time_str || null));
                return data.success;
            } catch (e) {
                addLog('处理请求失败: ' + e.message, 'error');
                return false;
            }
        }

        // ===== 查询功能 =====
        function setRecentTime(minutes) {
            const now = new Date();
            const start = new Date(now.getTime() - minutes * 60000);
            const pad = (n) => String(n).padStart(2, '0');
            document.getElementById('processDate').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
            document.getElementById('processStartTime').value = `${pad(start.getHours())}:${pad(start.getMinutes())}`;
            document.getElementById('processStopTime').value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
            queryByDate();
        }

        async function queryByDate() {
            const dateVal = document.getElementById('processDate').value;
            if (!dateVal) { alert('请选择日期'); return; }
            await doQuery({
                type: 'date',
                date: dateVal,
                start_time: document.getElementById('processStartTime').value,
                stop_time: document.getElementById('processStopTime').value
            });
        }

        async function queryByNumber() {
            const number = document.getElementById('numberInput').value.trim();
            if (!number) { alert('请输入编号'); return; }
            const boxIndices = getSelectedBoxIndices();
            await doQuery({ type: 'number', number, box_indices: boxIndices.length > 0 ? boxIndices : null });
        }

        async function queryByContent() {
            const content = document.getElementById('contentInput').value.trim();
            if (!content) { alert('请输入内容'); return; }
            await doQuery({ type: 'content', content });
        }

        async function queryDuplicates() {
            const dateVal = document.getElementById('processDate').value;
            if (!dateVal) { alert('请选择日期'); return; }
            await doQuery({ type: 'duplicates', date: dateVal });
        }

        async function queryAll() { await doQuery({ type: 'content', content: '' }); }

        function clearNumberInput() {
            document.getElementById('numberInput').value = '';
            document.querySelectorAll('.boxCheck').forEach((c, i) => {
                c.checked = false;
                updateBoxItemStyle(i);
            });
        }

        async function doQuery(params) {
            if (!params.sort_order) params.sort_order = sortOrder;
            lastQueryParams = {...params};
            const res = await fetch('/api/urldata/query', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(params)
            });
            const data = await res.json();
            displayResults(data.results);
            updateStats(data.stats, params.type);
        }

        function displayResults(results) {
            const tbody = document.getElementById('resultsBody');
            if (!results || results.length === 0) {
                tbody.innerHTML = '<tr><td colspan="13"><div class="empty-state"><div class="icon">🔍</div><div>没有找到匹配的数据</div></div></td></tr>';
                return;
            }
            tbody.innerHTML = results.map((item, idx) => {
                const typeClass = item.type === 'URL' ? 'type-url' : item.type === '失败' ? 'type-fail' : 'type-other';
                const safeContent = escapeHtml(item.content);
                return `<tr data-content="${safeContent}" data-idx="${idx}">
                    ${item.numbers.map(n => `<td class="number-cell">${n}</td>`).join('')}
                    <td>${item.verification || 'N/A'}</td>
                    <td>${item.date}</td>
                    <td class="${typeClass}">${item.type}</td>
                    <td class="content-cell">
                        <span class="content-text" title="${safeContent}">${safeContent}</span>
                        <button class="copy-btn" onclick="copyContent(this)">复制</button>
                    </td>
                </tr>`;
            }).join('');
            checkDuplicates(results);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text; return div.innerHTML;
        }

        function updateStats(stats, queryType) {
            const names = { date:'日期查询', number:'编号查询', content:'内容查询', duplicates:'重复查询' };
            document.getElementById('statsText').innerHTML = `${names[queryType]||'查询'} | 总计: <span>${stats.total}</span> | URL: <span>${stats.url}</span> | 失败: <span>${stats.fail}</span> | 其他: <span>${stats.other}</span>`;
        }

        function checkDuplicates(results) {
            const counts = {};
            results.forEach(r => counts[r.content] = (counts[r.content]||0) + 1);
            const dups = Object.entries(counts).filter(([_,c]) => c > 1);
            const info = document.getElementById('duplicatesInfo');
            if (dups.length > 0) {
                info.classList.add('show');
                info.innerHTML = `⚠️ 发现 ${dups.length} 个重复内容，共 ${dups.reduce((s,[_,c])=>s+c,0)} 条记录`;
            } else { info.classList.remove('show'); }
        }

        function clearResults() {
            document.getElementById('resultsBody').innerHTML = '<tr><td colspan="13"><div class="empty-state"><div class="icon">📋</div><div>请选择查询条件</div></div></td></tr>';
            document.getElementById('statsText').textContent = '就绪';
            document.getElementById('duplicatesInfo').classList.remove('show');
        }

        // ===== 定时器状态 =====
        async function loadSchedulerStatus() {
            try {
                const res = await fetch('/api/urldata/scheduler_status');
                const data = await res.json();
                document.getElementById('schedulerStatus').textContent = data.status || '⏸️ 定时处理未启用';
            } catch(e) {}
        }

        // ===== InfluxDB 调试 =====
        function influxLog(msg, level = 'info') {
            const box = document.getElementById('influxLog');
            const time = new Date().toLocaleTimeString();
            box.innerHTML += `<div class="log-${level}">[${time}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        async function checkInfluxStatus() {
            const box = document.getElementById('influxStatus');
            box.innerHTML = '<span style="color:#60a5fa;">检测中...</span>';
            try {
                const res = await fetch('/api/urldata/influx_status');
                const data = await res.json();
                if (data.success) {
                    box.innerHTML = `<span style="color:#22c55e;">✅ InfluxDB 连接正常 (${data.status})</span>`;
                    influxLog('连接成功: ' + data.status, 'success');
                    if (data.buckets) {
                        Object.entries(data.buckets).forEach(([name, info]) => {
                            if (info.connected) {
                                influxLog(`  Bucket "${name}": 已连接, 最近1小时${info.has_recent_data ? '有' : '无'}数据`, info.has_recent_data ? 'success' : 'warning');
                            } else {
                                influxLog(`  Bucket "${name}": 连接失败 - ${info.error}`, 'error');
                            }
                        });
                    }
                } else {
                    box.innerHTML = `<span style="color:#ef4444;">❌ ${data.error}</span>`;
                    influxLog('连接失败: ' + data.error, 'error');
                }
            } catch (e) {
                box.innerHTML = `<span style="color:#ef4444;">❌ 请求失败</span>`;
                influxLog('请求异常: ' + e.message, 'error');
            }
        }

        async function queryInfluxSample(bucketKey) {
            const hours = document.getElementById('influxHours').value;
            influxLog(`查询 ${bucketKey} 最近 ${hours} 小时数据...`);
            try {
                const res = await fetch(`/api/urldata/influx_sample?bucket=${bucketKey}&hours=${hours}&limit=20`);
                const data = await res.json();
                if (data.success) {
                    influxLog(`Bucket '${data.bucket}' 返回 ${data.count} 条记录`, data.count > 0 ? 'success' : 'warning');
                    if (data.records.length > 0) {
                        data.records.forEach((r, i) => {
                            influxLog(`  [${i+1}] ${r.time} | ${r.measurement}.${r.field} = ${r.value}`);
                        });
                    } else {
                        influxLog('  该时间范围内无数据', 'warning');
                    }
                } else {
                    influxLog('查询失败: ' + data.error, 'error');
                }
            } catch (e) {
                influxLog('请求异常: ' + e.message, 'error');
            }
        }

        // ===== 弹窗通用 =====
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        function openNumberQueryModal() {
            document.getElementById('numberQueryModal').classList.add('show');
        }

        // ===== 设置上下限弹窗 =====
        async function openSettingsModal() {
            const res = await fetch('/api/urldata/settings');
            const cfg = await res.json();
            const container = document.getElementById('settingsRows');
            container.innerHTML = BOX_NAMES.map((name, i) => `
                <div class="modal-row">
                    <label>${name}:</label>
                    <input type="number" id="setMin${i}" value="${cfg.mins[i]}" min="1" style="width:70px;">
                    <span style="color:#aaa;">~</span>
                    <input type="number" id="setMax${i}" value="${cfg.maxs[i]}" min="1" style="width:70px;">
                </div>
            `).join('');
            document.getElementById('settingsModal').classList.add('show');
        }

        async function saveSettings() {
            const mins = [], maxs = [];
            for (let i = 0; i < BOX_COUNT; i++) {
                const mn = parseInt(document.getElementById('setMin'+i).value);
                const mx = parseInt(document.getElementById('setMax'+i).value);
                if (isNaN(mn) || isNaN(mx) || mn <= 0 || mx <= 0) { alert('上下限必须为正数'); return; }
                if (mn > mx) { alert(BOX_NAMES[i] + ' 下限不能大于上限'); return; }
                mins.push(mn); maxs.push(mx);
            }
            const res = await fetch('/api/urldata/settings', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ mins, maxs })
            });
            const data = await res.json();
            if (data.success) { addLog('上下限设置已保存', 'success'); closeModal('settingsModal'); }
            else alert(data.error || '保存失败');
        }

        // ===== 定时处理设置弹窗 =====
        async function openSchedulerModal() {
            const res = await fetch('/api/urldata/scheduler_config');
            const cfg = await res.json();
            document.getElementById('schedulerEnabled').checked = cfg.enabled || false;
            document.getElementById('schedulerHours').value = cfg.hours || 1;
            document.getElementById('schedulerMinutes').value = cfg.minutes || 30;
            document.getElementById('schedulerSeconds').value = cfg.seconds || 0;
            document.getElementById('schedulerRetry').checked = cfg.retry || true;
            document.getElementById('schedulerRetryInterval').value = cfg.retry_interval || 30;
            document.getElementById('schedulerModal').classList.add('show');
        }

        async function saveScheduler() {
            const h = parseInt(document.getElementById('schedulerHours').value) || 0;
            const m = parseInt(document.getElementById('schedulerMinutes').value) || 0;
            const s = parseInt(document.getElementById('schedulerSeconds').value) || 0;
            if (h * 3600 + m * 60 + s < 10) { alert('总间隔不能少于10秒'); return; }
            const ri = parseInt(document.getElementById('schedulerRetryInterval').value) || 30;
            const res = await fetch('/api/urldata/scheduler_config', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    enabled: document.getElementById('schedulerEnabled').checked,
                    hours: h, minutes: m, seconds: s,
                    retry: document.getElementById('schedulerRetry').checked,
                    retry_interval: ri
                })
            });
            const data = await res.json();
            if (data.success) { addLog('定时处理设置已保存', 'success'); closeModal('schedulerModal'); loadSchedulerStatus(); }
            else alert(data.error || '保存失败');
        }

        // ===== 手动设定编号弹窗 =====
        async function openManualNumberModal() {
            const res = await fetch('/api/urldata/last_numbers');
            const cfg = await res.json();
            const container = document.getElementById('manualNumberRows');
            container.innerHTML = BOX_NAMES.map((name, i) => `
                <div class="modal-row">
                    <label>${name}:</label>
                    <input type="number" id="manNum${i}" value="${cfg.numbers[i]}">
                </div>
            `).join('');
            document.getElementById('manualNumberModal').classList.add('show');
        }

        async function saveManualNumbers() {
            const numbers = [];
            for (let i = 0; i < BOX_COUNT; i++) {
                const v = parseInt(document.getElementById('manNum'+i).value);
                if (isNaN(v)) { alert('所有编号必须是有效整数'); return; }
                numbers.push(v);
            }
            const res = await fetch('/api/urldata/last_numbers', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ numbers })
            });
            const data = await res.json();
            if (data.success) { addLog('手动更新编号成功: ' + numbers.join(','), 'success'); closeModal('manualNumberModal'); }
            else alert(data.error || '保存失败');
        }

        async function resetNumbers() {
            if (!confirm('确定要删除编号记录文件吗？下次处理将从下限开始。')) return;
            const res = await fetch('/api/urldata/last_numbers', { method: 'DELETE' });
            const data = await res.json();
            if (data.success) { addLog('编号记录已删除', 'success'); closeModal('manualNumberModal'); }
        }

        // ===== 错误时设置弹窗 =====
        async function openErrorSettingsModal() {
            const res = await fetch('/api/urldata/error_settings');
            const cfg = await res.json();
            document.getElementById('errorVerifyEnabled').checked = cfg.enabled;
            const container = document.getElementById('errorSettingsRows');
            container.innerHTML = BOX_NAMES.map((name, i) => `
                <div class="modal-row">
                    <label>${name}:</label>
                    <input type="number" id="errSet${i}" value="${cfg.error_settings[i]}" min="1">
                </div>
            `).join('');
            document.getElementById('verifyFileStatus').innerHTML = cfg.verify_file_status || '';
            document.getElementById('errorSettingsModal').classList.add('show');
        }

        function copyContent(btn) {
            const text = btn.parentElement.querySelector('.content-text').textContent;
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            ta.style.top = '-9999px';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
                btn.textContent = '已复制';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
            } catch (e) {
                alert('复制失败，请手动复制：\n' + text);
            }
            document.body.removeChild(ta);
        }

        async function saveErrorSettings() {
            const settings = [];
            for (let i = 0; i < BOX_COUNT; i++) {
                const v = parseInt(document.getElementById('errSet'+i).value);
                if (isNaN(v) || v <= 0) { alert('编号必须为正数'); return; }
                settings.push(v);
            }
            const res = await fetch('/api/urldata/error_settings', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    enabled: document.getElementById('errorVerifyEnabled').checked,
                    error_settings: settings
                })
            });
            const data = await res.json();
            if (data.success) { addLog('错误处理设置已保存', 'success'); closeModal('errorSettingsModal'); }
            else alert(data.error || '保存失败');
        }
    </script>
</body>
</html>
