      <aside class="mq-sidebar" aria-label="检验进度与查询记录">
        <section class="mq-inspection"><div class="mq-section-title"><h3>三号轮 · 八盒检验</h3><span class="mq-count mq-progress">4 / 8</span></div><div class="mq-slots" aria-label="三号轮编号一至八的检验状态"></div><div class="mq-meter" aria-hidden="true"><span></span></div><div class="mq-inspection-note"><span class="mq-round">第 1 轮检验</span><span>✓ 已扫码</span></div></section>
        <section class="mq-history"><div class="mq-section-title"><h3>查询记录</h3><span class="mq-count">4 条</span></div><div class="mq-record-list"></div><div class="mq-history-foot">点击记录，查看对应轮位</div></section>
      </aside>
      <section class="mq-stage" aria-label="七轮定位图">
        <header class="mq-stage-head"><div class="mq-stage-title"><i data-lucide="orbit" aria-hidden="true"></i><h3>轮模盒 · 运动轨迹</h3></div><button class="mq-button mq-button-small" type="button" data-action="reset">重置高亮</button></header>
        <div class="mq-selection"><div><span class="mq-selection-label">当前二维码</span><strong class="mq-selected-code">MH-03001</strong></div><span class="mq-located" role="status" aria-live="polite">7 / 7 轮已定位</span></div>
        <div class="mq-diagram-area"><svg class="mq-diagram" role="img" aria-label="一号轮位于左侧，二三号轮在左下，四五号轮在上方，六号轮在右下，八号轮在右上。一号轮仅含编号1和2。"></svg></div>
        <div class="mq-diagram-footer"><span class="mq-legend">实色模盒 · 当前定位</span><span>工位固定 · 高亮顺时针移动</span></div>
        <div class="mq-readouts" aria-label="各轮当前模盒编号"></div>
      </section>
      <section class="mq-records-table" aria-label="各轮编号记录对照"><div class="mq-section-title"><h3>记录与轮位对照</h3><span class="mq-hint">按记录时间倒序</span></div><div class="mq-table-scroll"><table><thead><tr><th scope="col">记录时间</th><th scope="col">二维码</th><th scope="col">一号</th><th scope="col">二号</th><th scope="col">三号</th><th scope="col">四号</th><th scope="col">五号</th><th scope="col">六号</th><th scope="col">八号</th><th scope="col">操作</th></tr></thead><tbody></tbody></table></div></section>
    </div>
    <footer class="mq-app-foot"><span>一号轮编号：1、2</span><span>示例轮位 · 其余轮编号范围以正式配置为准</span></footer>
  </section>
  <script>
    (()=>{
      const root=document.getElementById('mold-query-styles');
      const $=s=>root.querySelector(s), $$=s=>Array.from(root.querySelectorAll(s));
      const styleState={variant:'clean',depth:true};
      const ns='http://www.w3.org/2000/svg', reduce=matchMedia('(prefers-reduced-motion: reduce)');
      // Only presentation data; no production APIs or stored configuration are changed.
      // Wheel one has exactly two explicit, valid identifiers in every demo record.
      const configs=[
        {id:1,name:'一号轮',numbers:[1,2],cx:58,cy:285,rx:35,ry:83,rotation:20},
        {id:2,name:'二号轮',numbers:[1,2,3,4,5,6],cx:201,cy:286,rx:88,ry:54,rotation:0},
        {id:3,name:'三号轮',numbers:[1,2,3,4,5,6,7,8],cx:390,cy:293,rx:88,ry:54,rotation:0},
        {id:4,name:'四号轮',numbers:[1,2,3,4,5,6],cx:497,cy:144,rx:96,ry:57,rotation:0},
        {id:5,name:'五号轮',numbers:[1,2,3,4,5,6],cx:704,cy:144,rx:89,ry:54,rotation:0},
        {id:6,name:'六号轮',numbers:[1,2,3,4,5,6],cx:789,cy:327,rx:91,ry:54,rotation:0},
        {id:8,name:'八号轮',numbers:[1,2,3,4,5,6],cx:902,cy:146,rx:83,ry:54,rotation:0}
      ];
      const records=[
        {code:'MH-03001',time:'14:32:08',values:[1,3,4,2,5,3,6]},
        {code:'MH-03002',time:'14:31:46',values:[2,5,1,4,2,6,3]},
        {code:'MH-03003',time:'14:31:20',values:[1,2,6,1,4,2,5]},
        {code:'MH-03004',time:'14:30:57',values:[2,4,2,6,3,5,1]}
      ];
      let selected=0, drawing=[],frame=0,animationStart=0;
      const seen=new Set([1,2,4,6]);
      const positions=configs.map((w,i)=>w.numbers.indexOf(records[0].values[i])/w.numbers.length);
      const mod=v=>((v%1)+1)%1;
      function make(tag,cls,text,parent){const el=document.createElement(tag);if(cls)el.className=cls;if(text!=null)el.textContent=text;if(parent)parent.appendChild(el);return el;}
      function svg(tag,attrs,parent){const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));if(parent)parent.appendChild(el);return el;}
      function label(text,x,y,cls,parent){const el=svg('text',{x,y,class:cls},parent);el.textContent=text;return el;}
      function point(w,f){const a=f*Math.PI*2-Math.PI/2,r=w.rotation*Math.PI/180,x=w.rx*Math.cos(a),y=w.ry*Math.sin(a);return{x:w.cx+x*Math.cos(r)-y*Math.sin(r),y:w.cy+x*Math.sin(r)+y*Math.cos(r)};}
      function tile(parent,p,value,active){const g=svg('g',{transform:`translate(${p.x} ${p.y})`},parent);if(active)svg('rect',{x:-18,y:-17,width:36,height:34,rx:9,class:'mq-marker-halo'},g);svg('rect',{x:-11,y:-11,width:22,height:22,rx:4,class:active?'mq-marker-face':'mq-station-face'},g);const text=label(value,0,1,active?'mq-marker-number':'mq-station-number',g);return {g,text};}
      function renderDiagram(){
        cancelAnimationFrame(frame);frame=0;
        const host=$('.mq-diagram-area'), diagram=$('.mq-diagram');
        const width=Math.max(220,Math.round(host.clientWidth-16));
        const compact=width<570;
        const cols=width<360?1:2;
        const height=compact?Math.ceil(configs.length/cols)*174+14:Math.max(315,width*.46);
        diagram.setAttribute('viewBox',`0 0 ${width} ${height}`);diagram.style.height=height+'px';
        diagram.replaceChildren();drawing=[];
        svg('title',{},diagram).textContent='七轮模盒定位示意，一号轮仅有编号1和2';
        if(compact)label('窄屏轮位分组',width/2,10,'mq-wheel-detail',diagram);
        configs.forEach((config,index)=>{
          let w;
          if(compact){const cell=width/cols;w={...config,cx:cell*(index%cols+.5),cy:Math.floor(index/cols)*174+98,rx:config.id===1?25:Math.min(62,cell*.33),ry:config.id===1?46:37,rotation:config.id===1?20:0};}
          else{const scale=(width-30)/1000;w={...config,cx:15+config.cx*scale,cy:config.cy/430*(height-12)+4,rx:Math.max(config.id===1?20:45,config.rx*scale),ry:config.id===1?56:Math.max(30,config.ry*scale)};}
          const g=svg('g',{'data-wheel':w.id},diagram);
          const r=`rotate(${w.rotation} ${w.cx} ${w.cy})`;
          if(styleState.depth)svg('ellipse',{cx:w.cx,cy:w.cy+7,rx:w.rx+7,ry:w.ry+7,transform:r,class:'mq-wheel-edge'},g);
          svg('ellipse',{cx:w.cx,cy:w.cy,rx:w.rx+7,ry:w.ry+7,transform:r,class:'mq-wheel-face'},g);
          svg('ellipse',{cx:w.cx,cy:w.cy,rx:w.rx,ry:w.ry,transform:r,class:'mq-wheel-track'},g);
          config.numbers.forEach((n,i)=>{const p=point(w,i/config.numbers.length);svg('line',{x1:w.cx,y1:w.cy,x2:p.x,y2:p.y,class:'mq-wheel-spoke'},g);});
          svg('ellipse',{cx:w.cx,cy:w.cy,rx:w.id===1?13:26,ry:17,class:'mq-wheel-face'},g);
          let titleX=w.cx,titleY=w.cy-w.ry-30;
          if(!compact&&w.id===1)titleY=w.cy-w.ry-46;
          label(w.name,titleX,titleY,'mq-wheel-title',g);
          if(w.id===1)label('仅 1 / 2',titleX,titleY+18,'mq-wheel-detail',g);
          config.numbers.forEach((n,i)=>{const t=tile(g,point(w,i/config.numbers.length),String(n),false);svg('title',{},t.g).textContent=w.name+' · 模盒 '+n;});
          const value=selected===null?'—':String(records[selected].values[index]);
          label(value,w.cx,w.cy,'mq-wheel-value',g);
          const target=selected===null?0:config.numbers.indexOf(records[selected].values[index])/config.numbers.length;
          positions[index]=target;
          const marker=tile(g,point(w,target),value,true);
          marker.g.setAttribute('visibility',selected===null?'hidden':'visible');
          drawing.push({w,marker});
        });
        if(selected!==null)$('.mq-located').textContent='7 / 7 轮已定位';
      }
      function renderSelection(){
        $$('.mq-record').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)));
        $$('.mq-data-row').forEach((row,i)=>{row.dataset.selected=String(i===selected);row.querySelector('button').textContent=i===selected?'已定位':'定位';});
        $('.mq-selected-code').textContent=selected===null?'尚未选择':records[selected].code;
        $$('.mq-readout strong').forEach((el,i)=>el.textContent=selected===null?'—':String(records[selected].values[i]));
      }
      function select(index,animate=true){
        cancelAnimationFrame(frame);frame=0;selected=index;renderSelection();
        $('.mq-located').textContent='7 / 7 轮已定位';
        if(!drawing.length){renderDiagram();return;}
        const targets=configs.map((c,i)=>c.numbers.indexOf(records[index].values[i])/c.numbers.length);
        const start=positions.slice(),dist=targets.map((t,i)=>mod(t-start[i]));
        drawing.forEach((d,i)=>{d.marker.g.setAttribute('visibility','visible');d.marker.text.textContent=String(records[index].values[i]);d.marker.g.parentNode.querySelector('.mq-wheel-value').textContent=String(records[index].values[i]);});
        function paint(t){
          drawing.forEach((d,i)=>{positions[i]=start[i]+dist[i]*t;const p=point(d.w,positions[i]);d.marker.g.setAttribute('transform',`translate(${p.x} ${p.y})`);d.marker.text.textContent=t<1&&dist[i]>.001?'·':String(records[index].values[i]);});
        }
        if(!animate||reduce.matches||dist.every(d=>d<.001)){paint(1);return;}
        $('.mq-located').textContent='正在定位…';animationStart=performance.now();
        function step(now){const t=Math.min(1,(now-animationStart)/820);paint(t*t*(3-2*t));if(t<1)frame=requestAnimationFrame(step);else{frame=0;$('.mq-located').textContent='7 / 7 轮已定位';}}
        frame=requestAnimationFrame(step);
      }
      records.forEach((record,index)=>{
        const b=make('button','mq-record',null,$('.mq-record-list'));b.type='button';b.setAttribute('aria-pressed',String(index===0));
        make('span','mq-code',record.code,b);const meta=make('span','mq-record-meta',null,b);make('span','',record.time,meta);make('span','',`三号轮 · ${record.values[2]}`,meta);
        b.addEventListener('click',()=>{select(index);$('.mq-search-status').textContent='已切换至 '+record.code+' 的示例定位。';$('.mq-search-status').dataset.error='false';});
        const row=make('tr','mq-data-row',null,$('tbody'));make('td','',record.time,row);make('td','',record.code,row);record.values.forEach(v=>make('td','',String(v),row));const cell=make('td','',null,row);const pick=make('button','mq-table-select','定位',cell);pick.type='button';pick.addEventListener('click',()=>select(index));
      });
      configs.forEach(w=>{const el=make('div','mq-readout',null,$('.mq-readouts'));make('span','',w.name,el);make('strong','',null,el);});
      for(let n=1;n<=8;n++){const slot=make('span','mq-slot',String(n),$('.mq-slots'));slot.dataset.hit=String(seen.has(n));slot.setAttribute('aria-label',`${n}号模盒，${seen.has(n)?'已扫码':'未扫码'}`);}
      $('.mq-search').addEventListener('submit',event=>{
        event.preventDefault();const query=$('#mq-qrcode').value.trim().toUpperCase();
        const index=query?records.findIndex(record=>record.code.includes(query)):-1;
        $('.mq-search-status').dataset.error=String(index<0);
        if(index<0){$('.mq-search-status').textContent=query?'未找到示例记录，可输入 MH-03001 至 MH-03004。':'请输入二维码后查询。';return;}
        select(index);$('.mq-search-status').textContent='已找到 '+records[index].code+' · 示例记录时间 '+records[index].time;
      });
      $('[data-action="clear"]').addEventListener('click',()=>{$('#mq-qrcode').value='';$('.mq-search-status').dataset.error='false';$('.mq-search-status').textContent='输入示例二维码后查询。';$('#mq-qrcode').focus();});
      $('[data-action="reset"]').addEventListener('click',()=>{cancelAnimationFrame(frame);frame=0;selected=null;renderSelection();drawing.forEach(d=>{d.marker.g.setAttribute('visibility','hidden');d.marker.g.parentNode.querySelector('.mq-wheel-value').textContent='—';});$('.mq-located').textContent='等待选择记录';});
      function renderStyle(){root.dataset.style=styleState.variant;$$('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===styleState.variant)));renderDiagram();}
      $$('[data-variant]').forEach(b=>b.addEventListener('click',()=>{styleState.variant=b.dataset.variant;renderStyle();}));
      renderSelection();renderStyle();
      let lastWidth=$('.mq-diagram-area').clientWidth;
      new ResizeObserver(entries=>{const width=entries[0].target.clientWidth;if(Math.abs(width-lastWidth)>1){lastWidth=width;renderDiagram();}}).observe($('.mq-diagram-area'));
      reduce.addEventListener('change',()=>{if(reduce.matches&&selected!==null)select(selected,false);});
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:renderStyle});tweak.addSelect(styleState,'variant',{label:'界面风格',options:[{label:'A · 简洁蓝白',value:'clean'},{label:'B · 深色工控',value:'control'},{label:'C · 紧凑工作台',value:'dense'}]});tweak.addToggle(styleState,'depth',{label:'转台立体层次'});}
    })();
  </script>
</div>
